# Producción (VPS). Postgres/Storage/SMTP son externos (Supabase / S3 / SMTP),
# configurados por .env. Para la infra local de desarrollo, ver
# docker-compose.dev.yml.
services:
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: [.env]
    # Sin `ports`: la API NO se publica al host. Caddy la alcanza por la red
    # de compose (api:3000). Evita exponer el backend salteándose el proxy/TLS.
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 5

  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    restart: unless-stopped
    env_file: [.env]
    # Escalable: docker compose up --scale worker=3 (SKIP LOCKED lo soporta)
    deploy:
      replicas: 1

  # Reverse-proxy con TLS automático. Expone la API en API_DOMAIN_PLACEHOLDER.
  # El CORS lo pone SOLO Fastify; Caddy no agrega cabeceras CORS.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80", "443:443"]
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

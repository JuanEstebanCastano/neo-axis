# Infra LOCAL de desarrollo (no producción): Postgres, almacenamiento S3 (MinIO),
# correo (Mailpit) y las migraciones. En producción NADA de esto corre: Postgres
# es Supabase, Storage es Supabase Storage y el SMTP es externo.
#
# Uso típico:
#   docker compose -f docker-compose.dev.yml up        # levanta la infra local
#   pnpm --filter @neoaxis/api dev                      # api/worker desde el host
#
# Requiere un .env con los valores locales (postgres:5432, minio:9000, etc.).
services:
  postgres:
    # 18 es obligatorio: uuidv7() nativo. No bajar de versión.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: ghcr.io/amacneil/dbmate:2
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./db/migrations:/db/migrations
    command: ["--wait", "up"]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/${S3_BUCKET} &&
      echo 'bucket listo'"

  mailpit:
    # Captura todo el correo saliente en dev. UI en http://localhost:8025
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ["8025:8025"]

volumes:
  pgdata:
  miniodata:

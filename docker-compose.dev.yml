# Infra LOCAL de desarrollo (no producción): Postgres, almacenamiento S3 (MinIO),
# correo (Mailpit) y las migraciones. En producción NADA de esto corre: Postgres
# es Supabase, Storage es Supabase Storage y el SMTP es externo.
#
# Uso típico:
#   docker compose -f docker-compose.dev.yml up        # levanta la infra local
#   pnpm --filter @neoaxis/api dev                      # api/worker desde el host
#
# AUTOCONTENIDO A PROPÓSITO: este archivo NO lee DATABASE_URL ni S3_* del .env.
# Ese .env apunta a Supabase y a su bucket de producción, así que heredarlo haría
# que `migrate` corriera dbmate CONTRA LA BASE DE PRODUCCIÓN. Las credenciales de
# abajo son locales y desechables; se pueden sobreescribir con las DEV_*.
services:
  postgres:
    # 18 es obligatorio: uuidv7() nativo. No bajar de versión.
    # pgvector/pgvector en vez de postgres:18-alpine porque la migración
    # 20261105120002 hace CREATE EXTENSION vector y la imagen oficial no lo trae
    # ("extension vector is not available"). En Supabase la extensión ya existe.
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DEV_POSTGRES_USER:-neoaxis}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-neoaxis}
      POSTGRES_DB: ${DEV_POSTGRES_DB:-neoaxis}
    ports: ["5432:5432"]
    volumes:
      # OJO: en la imagen 18 el montaje va en /var/lib/postgresql, NO en
      # .../data. Con el path viejo el contenedor arranca, declara el volumen
      # "unused mount/volume" y se queda en bucle de reinicio.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: ghcr.io/amacneil/dbmate:2
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      # Apunta SIEMPRE al postgres de este compose. Nunca al DATABASE_URL del .env.
      DATABASE_URL: postgres://${DEV_POSTGRES_USER:-neoaxis}:${DEV_POSTGRES_PASSWORD:-neoaxis}@postgres:5432/${DEV_POSTGRES_DB:-neoaxis}?sslmode=disable
    volumes:
      - ./db/migrations:/db/migrations
    command: ["--wait", "up"]

  minio:
    # MinIO desapareció de Docker Hub en septiembre de 2026 (minio/minio y
    # minio/mc ya no existen) y quay.io no permite descargas anónimas. Esta es
    # la imagen que mantiene Chainguard a partir del fork, y es la única que se
    # puede bajar sin cuenta.
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    # La imagen corre como el usuario 65532, que no puede escribir en el volumen
    # recién creado (Docker lo crea como root): "Unable to initialize backend:
    # file access denied". Son datos locales y desechables, así que va como root.
    user: "0:0"
    # Sin --console-address: las versiones nuevas ya no traen la consola web.
    command: server /data
    environment:
      MINIO_ROOT_USER: ${DEV_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${DEV_S3_SECRET_KEY:-minioadmin}
    ports: ["9000:9000"]
    volumes:
      - miniodata:/data
    # Sin healthcheck: la imagen no trae shell ni mc ni curl con los que
    # comprobarlo. Quien espera de verdad es minio-init, abajo.

  minio-init:
    # Variante -dev porque la normal es distroless y aquí hace falta un shell
    # para esperar a que el servidor levante.
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on: [minio]
    environment:
      # mc toma el alias "local" de esta variable; no hay que correr `mc alias set`.
      MC_HOST_local: http://${DEV_S3_ACCESS_KEY:-minioadmin}:${DEV_S3_SECRET_KEY:-minioadmin}@minio:9000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc ready local; do sleep 1; done
        mc mb --ignore-existing local/${DEV_S3_BUCKET:-neoaxis}
        echo 'bucket listo'

  mailpit:
    # Captura todo el correo saliente en dev. UI en http://localhost:8025
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ["8025:8025"]

volumes:
  pgdata:
  miniodata:
